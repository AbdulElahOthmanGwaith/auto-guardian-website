<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نموذج الاتصال - Auto Guardian Core</title>
    <style>
        :root {
            --primary: #0F172A;
            --secondary: #3B82F6;
            --success: #10B981;
            --danger: #EF4444;
            --warning: #F59E0B;
            --bg: #F8FAFC;
            --card-bg: #FFFFFF;
            --text: #1E293B;
            --text-muted: #64748B;
            --border: #E2E8F0;
        }

        body.dark-mode {
            --bg: #0F172A;
            --card-bg: #1E293B;
            --text: #F1F5F9;
            --text-muted: #94A3B8;
            --border: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 2rem;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .form-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .form-header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: var(--primary);
        }

        .form-header p {
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text);
        }

        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            font-family: inherit;
            font-size: 1rem;
            background-color: var(--card-bg);
            color: var(--text);
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        textarea:focus {
            outline: none;
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 150px;
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--secondary);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #2563eb;
        }

        button:active {
            transform: scale(0.98);
        }

        .form-message {
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 0.5rem;
            text-align: center;
        }

        .form-message-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .form-message-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .required {
            color: var(--danger);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-header">
            <h1>📧 تواصل معنا</h1>
            <p>نحن هنا للإجابة على أسئلتك والاستماع لاقتراحاتك</p>
        </div>

        <form id="contact-form" data-endpoint="" data-fallback-email="fcab8090@gmail.com">
            <div class="form-group">
                <label for="name">الاسم <span class="required">*</span></label>
                <input 
                    type="text" 
                    id="name" 
                    name="name" 
                    placeholder="أدخل اسمك الكامل"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">البريد الإلكتروني <span class="required">*</span></label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="your@email.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="subject">الموضوع <span class="required">*</span></label>
                <input 
                    type="text" 
                    id="subject" 
                    name="subject" 
                    placeholder="موضوع الرسالة"
                    required
                >
            </div>

            <div class="form-group">
                <label for="message">الرسالة <span class="required">*</span></label>
                <textarea 
                    id="message" 
                    name="message" 
                    placeholder="اكتب رسالتك هنا..."
                    required
                ></textarea>
            </div>

            <button type="submit" id="submit-button">إرسال الرسالة</button>
            <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
        </form>
    </div>

    <script>
        const form = document.getElementById('contact-form');
        const submitButton = document.getElementById('submit-button');
        const status = document.getElementById('form-status');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const formData = new FormData(form);
            const data = {
                name: String(formData.get('name') || '').trim(),
                email: String(formData.get('email') || '').trim(),
                subject: String(formData.get('subject') || '').trim(),
                message: String(formData.get('message') || '').trim(),
                timestamp: new Date().toISOString()
            };
            const endpoint = (form.dataset.endpoint || '').trim();
            const fallbackEmail = (form.dataset.fallbackEmail || 'fcab8090@gmail.com').trim();

            submitButton.disabled = true;
            submitButton.textContent = 'جارٍ التجهيز…';
            form.setAttribute('aria-busy', 'true');
            status.textContent = '';

            try {
                if (!endpoint || endpoint.includes('YOUR_FORM_ID')) {
                    const mailto = `mailto:${fallbackEmail}?subject=${encodeURIComponent(data.subject)}&body=${encodeURIComponent(
                        `الاسم: ${data.name}\nالبريد: ${data.email}\n\n${data.message}`
                    )}`;
                    window.location.href = mailto;
                    status.textContent = 'لم تتم تهيئة خدمة الإرسال بعد؛ فُتح تطبيق البريد لإكمال الرسالة يدوياً.';
                    return;
                }

                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                if (!response.ok) throw new Error(`Request failed: ${response.status}`);

                status.textContent = 'تم إرسال الرسالة بنجاح. شكراً لتواصلك معنا.';
                form.reset();
            } catch (error) {
                console.error('Contact form submission failed:', error);
                status.textContent = 'تعذر الإرسال عبر الخادم. تحقق من الاتصال أو أرسل الرسالة عبر البريد الإلكتروني مباشرة.';
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = 'إرسال الرسالة';
                form.setAttribute('aria-busy', 'false');
            }
        });
    </script>
</body>
</html>
